<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body>
<header th:replace="~{fragments/layout :: cabecalho}"></header>

<main class="container pagina-auth">
    <section class="auth">
        <div class="auth__lateral" aria-hidden="true">
            <img th:src="@{/img/cesta.svg}" alt="" width="180" height="180">
            <h2>Bem-vindo de volta!</h2>
            <p>Acesse sua conta para consultar o catálogo ou gerenciar o Mercado Express.</p>
        </div>

        <div class="auth__formulario">
            <h1>Entrar</h1>
            <p class="texto-suave">Use o e-mail e a senha cadastrados.</p>

            <div th:replace="~{fragments/layout :: mensagens}"></div>
            <div th:if="${param.erro}" class="alerta alerta--erro" role="alert" data-testid="erro-login">
                E-mail ou senha incorretos. Tente novamente.
            </div>

            <form th:action="@{/login}" method="post" class="formulario" novalidate>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required autocomplete="username"
                           placeholder="voce@exemplo.com" th:value="${param.email}" autofocus>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="campo__senha">
                        <input type="password" id="senha" name="senha" required autocomplete="current-password"
                               placeholder="Sua senha">
                        <button type="button" class="botao-icone" data-toggle-senha="senha"
                                aria-label="Mostrar senha">Mostrar</button>
                    </div>
                </div>
                <button type="submit" class="botao botao--bloco">Entrar</button>
            </form>

            <div th:replace="~{fragments/layout :: credenciais(true)}"></div>

            <p class="auth__rodape">
                Ainda não tem conta? <a th:href="@{/cadastro}">Cadastre-se (Sign Up)</a>
            </p>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
