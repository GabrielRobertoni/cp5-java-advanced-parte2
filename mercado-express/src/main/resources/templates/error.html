<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Erro')}"></head>
<body>
<header th:replace="~{fragments/layout :: cabecalho}"></header>

<main class="container pagina pagina--centro">
    <div class="erro-pagina" data-testid="pagina-erro">
        <p class="erro-pagina__codigo" th:text="${status} ?: 'Erro'">Erro</p>
        <h1>Algo deu errado</h1>
        <p class="texto-suave">Não foi possível concluir a operação. Tente novamente em instantes.</p>
        <a th:href="@{/}" class="botao">Voltar ao início</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
