# ==========================================================
#  Mercado Express - CP5 Java Advanced (Parte II)
#  Loja (MVC + Spring Security), API REST de pagamentos e
#  integração com o Banco Tranquilo e o serviço de e-mail via RabbitMQ.
#  Os valores após ":" são padrões para rodar localmente.
# ==========================================================
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: mercado-express

  # Mesmo PostgreSQL da Parte I (banco mercado_express, schema public)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mercado_express}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Broker RabbitMQ (local, Docker ou CloudAMQP/LavinMQ via RABBITMQ_ADDRESSES=amqps://...)
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:amqp://guest:guest@localhost:5672}
    listener:
      simple:
        # Mensagem com erro: 3 tentativas e depois vai para a dead letter queue (não fica em loop)
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

  thymeleaf:
    cache: true

  # Permite PUT/DELETE em formulários HTML (campo oculto _method gerado pelo Thymeleaf)
  mvc:
    hiddenmethod:
      filter:
        enabled: true

app:
  # Usuários criados automaticamente na primeira execução (se ainda não existirem)
  admin:
    nome: ${ADMIN_NAME:Gerente Mercado Express}
    email: ${ADMIN_EMAIL:admin@mercadoexpress.com}
    senha: ${ADMIN_PASSWORD:Admin@123}
  demo-cliente:
    criar: ${DEMO_CLIENTE_ENABLED:true}
    nome: Cliente Demonstração
    email: ${DEMO_CLIENTE_EMAIL:cliente@mercadoexpress.com}
    senha: ${DEMO_CLIENTE_PASSWORD:Cliente@123}
  pagamentos:
    # Reenvia ao broker as mensagens que não puderam ser publicadas (ex.: RabbitMQ fora do ar)
    reenvio-intervalo: 30s
    reenvio-apos: 20s

logging:
  level:
    root: INFO
    br.com.fiap.mercadoexpress: INFO
